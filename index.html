<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A4・A3 POP面付けツール</title>
  <style>
    :root{--navy:#14233f;--blue:#2563eb;--pale:#eef4ff;--line:#d7dfeb;--text:#182235;--muted:#67748a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fb;color:var(--text);font-family:"Yu Gothic UI",Meiryo,sans-serif}button,label{font:inherit}button{color:inherit}
    .topbar{min-height:82px;display:flex;align-items:center;gap:14px;padding:16px 32px;color:#fff;background:linear-gradient(120deg,#12213d,#19345f);box-shadow:0 4px 16px #13213a25}
    .brand{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:#3b82f6;font-size:23px;font-weight:900}.topbar h1{margin:0 0 3px;font-size:21px}.topbar p{margin:0;color:#bed0ec;font-size:12px}
    .local{margin-left:auto;display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #ffffff28;border-radius:999px;background:#ffffff12;color:#dce9ff;font-size:12px}.local i{width:8px;height:8px;border-radius:50%;background:#50d89a}
    .workspace{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;max-width:1440px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #e1e7f0;border-radius:18px;box-shadow:0 8px 30px #3045630b}.settings{padding:20px;height:max-content}
    .block{position:relative;padding:0 0 22px 38px;margin-bottom:20px;border-bottom:1px solid #edf0f5}.step{position:absolute;left:0;top:0;width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--navy);color:#fff;font-size:13px;font-weight:800}.block h2{margin:2px 0 13px;font-size:14px}
    .two,.segments,.divisions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice,.division,.segments button{border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}.choice{min-height:62px;display:flex;align-items:center;justify-content:center;gap:11px;font-weight:700}.choice.active,.division.active,.segments button.active{border-color:var(--blue);background:var(--pale);color:#174fad;box-shadow:inset 0 0 0 1px var(--blue)}
    .paper{display:inline-block;border:2px solid currentColor;border-radius:2px;background:#fff}.paper.v{width:20px;height:28px}.paper.h{width:28px;height:20px}.division{padding:10px 5px;display:flex;flex-direction:column;gap:2px}.division strong{font-size:13px}.division span{font-size:10px;color:var(--muted)}.segments button{min-height:38px;font-size:13px;font-weight:700}
    .save{width:100%;min-height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#1f66e5,#184fc1);color:#fff;cursor:pointer;font-weight:800;box-shadow:0 8px 17px #2563eb30}.save:disabled{background:#b6c1d1;box-shadow:none;cursor:not-allowed}.note{margin:9px 0 0;text-align:center;color:var(--muted);font-size:11px}
    .editor{overflow:hidden}.head{min-height:77px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #e7ebf1}.head h2{margin:0 0 4px;font-size:17px}.head p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.bulk,.clear{min-height:38px;display:flex;align-items:center;padding:0 13px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700}.bulk{background:var(--navy);color:#fff}.bulk input{display:none}.clear{border:1px solid var(--line);background:#fff}.clear:disabled{opacity:.45;cursor:not-allowed}
    .stage{min-height:610px;padding:22px;display:grid;place-items:center;background:linear-gradient(135deg,#eef2f7,#e5ebf3);overflow:auto}.sheet{display:grid;background:#fff;box-shadow:0 10px 32px #1b2c4535;overflow:hidden}.sheet.portrait{width:min(52vw,460px);aspect-ratio:210/297}.sheet.landscape{width:min(67vw,650px);aspect-ratio:297/210}
    .slot{position:relative;min-width:0;min-height:0;overflow:hidden}.slot.lines{outline:1px solid #8993a1;outline-offset:-1px}.slot input{display:none}.slot-main{width:100%;height:100%;display:block;padding:0;border:0;background:#fff;cursor:pointer;overflow:hidden}.slot-main img{width:100%;height:100%;display:block;object-fit:cover}.slot-main.dragging{background:#dce9ff;box-shadow:inset 0 0 0 4px #3b82f6}.empty{width:100%;height:100%;display:grid;place-content:center;justify-items:center;gap:3px;color:#a4afbe;background:repeating-linear-gradient(135deg,#fff,#fff 12px,#fafbfd 12px,#fafbfd 24px)}.empty b{width:30px;height:30px;display:grid;place-items:center;border:1px dashed #aeb9c8;border-radius:50%;font-size:18px;font-weight:500}.empty small{font-size:10px}.remove{position:absolute;top:5px;right:5px;width:23px;height:23px;padding:0;border:0;border-radius:50%;background:#111b2dcc;color:#fff;cursor:pointer;font-size:15px}.resolution-warning{position:absolute;left:5px;bottom:5px;padding:3px 6px;border-radius:5px;background:#b42318e8;color:#fff;font-size:9px;font-weight:800;pointer-events:none}.quality-note{margin:7px 0 0;color:#b42318;font-size:10px;font-weight:700}
    .tip{padding:13px 20px;background:#f8fafc;border-top:1px solid #e5eaf1;color:#58677d;font-size:12px}.tip b{color:#26354c}
    @media(max-width:860px){.workspace{grid-template-columns:1fr}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}.block{margin:0}.save,.note{grid-column:1/-1}.sheet.portrait{width:min(78vw,460px)}.sheet.landscape{width:min(82vw,650px)}}
    @media(max-width:560px){.topbar{padding:14px 16px}.topbar p,.local{display:none}.workspace{padding:12px}.settings{display:block}.block{margin-bottom:16px}.head{align-items:flex-start;flex-direction:column}.stage{min-height:420px;padding:12px}.sheet.portrait,.sheet.landscape{width:82vw}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">M</div><div><h1>A4・A3 POP面付けツール</h1><p>用紙サイズと分割数を選び、高画質な印刷用データを作成</p></div><span class="local"><i></i>ローカル処理</span></header>
  <main class="workspace">
    <aside class="panel settings">
      <section class="block"><span class="step">1</span><h2>出力用紙</h2><div class="two"><button class="choice active" data-paper="A4">A4</button><button class="choice" data-paper="A3">A3</button></div></section>
      <section class="block"><span class="step">2</span><h2>用紙の向き</h2><div class="two"><button class="choice active" data-orientation="portrait"><span class="paper v"></span>縦</button><button class="choice" data-orientation="landscape"><span class="paper h"></span>横</button></div></section>
      <section class="block"><span class="step">3</span><h2>分割数</h2><div class="divisions"><button class="division" data-count="2"><strong>2分割</strong><span></span></button><button class="division" data-count="4"><strong>4分割</strong><span></span></button><button class="division active" data-count="8"><strong>8分割</strong><span></span></button><button class="division" data-count="16"><strong>16分割</strong><span></span></button><button id="division32" class="division" data-count="32" hidden><strong>32分割</strong><span></span></button></div></section>
      <section class="block"><span class="step">4</span><h2>境界線（裁断ガイド）</h2><div class="segments"><button data-lines="off">なし</button><button class="active" data-lines="on">あり</button></div></section>
      <section class="block"><span class="step">5</span><h2>保存形式</h2><div class="segments"><button data-format="jpeg">JPG（高画質）</button><button class="active" data-format="png">PNG（推奨）</button></div></section>
      <button id="save" class="save" disabled>面付け画像を保存</button><p id="status" class="note">A4・300dpi相当／0枚配置済み</p>
    </aside>
    <section class="panel editor"><div class="head"><div><h2>画像を配置</h2><p>各枠へドラッグ、またはクリックして選択</p></div><div class="actions"><label class="bulk">複数画像を選択<input id="bulk" type="file" accept="image/*" multiple></label><button id="clear" class="clear" disabled>すべて削除</button></div></div><div class="stage"><div id="sheet" class="sheet portrait"></div></div><div id="tip" class="tip"></div></section>
  </main>
  <script>
    (()=>{
      const state={paper:'A4',orientation:'portrait',count:8,lines:true,format:'png',slots:Array(8).fill(null)};
      const sheet=document.getElementById('sheet'),save=document.getElementById('save'),clear=document.getElementById('clear'),status=document.getElementById('status'),tip=document.getElementById('tip'),bulk=document.getElementById('bulk'),division32=document.getElementById('division32');
      const outputPixels=()=>state.paper==='A4'?{w:2480,h:3508}:{w:3508,h:4961};
      const sizeLabel=()=>`A${(state.paper==='A4'?4:3)+Math.log2(state.count)}`;
      function grid(){const p={2:1,4:2,8:2,16:4,32:4};const cols=state.orientation==='portrait'?p[state.count]:state.count/p[state.count];return{cols,rows:state.count/cols}}
      function cellPixels(){const base=outputPixels(),g=grid(),w=state.orientation==='portrait'?base.w:base.h,h=state.orientation==='portrait'?base.h:base.w;return{w:w/g.cols,h:h/g.rows}}
      function isLowResolution(item){if(!item||!item.width||!item.height)return false;const cell=cellPixels();return Math.max(cell.w/item.width,cell.h/item.height)>1.05}
      function clean(){state.slots.forEach(x=>x&&URL.revokeObjectURL(x.url));state.slots=Array(state.count).fill(null)}
      function makeItem(file,done){if(!file||!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file),image=new Image();image.onload=()=>done({file,url,width:image.naturalWidth,height:image.naturalHeight});image.onerror=()=>{URL.revokeObjectURL(url);done(null)};image.src=url}
      function setFile(index,file){makeItem(file,item=>{if(!item)return;const old=state.slots[index];if(old)URL.revokeObjectURL(old.url);state.slots[index]=item;render()})}
      function remove(index){const old=state.slots[index];if(old)URL.revokeObjectURL(old.url);state.slots[index]=null;render()}
      function refreshDivisionLabels(){document.querySelectorAll('[data-count]').forEach(button=>{button.querySelector('span').textContent=`${`A${(state.paper==='A4'?4:3)+Math.log2(Number(button.dataset.count))}`}相当`});division32.hidden=state.paper!=='A3'}
      function render(){
        const g=grid();sheet.className='sheet '+state.orientation;sheet.style.gridTemplateColumns=`repeat(${g.cols},1fr)`;sheet.style.gridTemplateRows=`repeat(${g.rows},1fr)`;sheet.innerHTML='';
        state.slots.forEach((item,i)=>{const slot=document.createElement('div');slot.className='slot'+(state.lines?' lines':'');const button=document.createElement('button');button.className='slot-main';button.type='button';button.innerHTML=item?`<img src="${item.url}" alt="${i+1}番の画像">`:`<span class="empty"><b>＋</b><small>${i+1}</small></span>`;const input=document.createElement('input');input.type='file';input.accept='image/*';button.onclick=()=>input.click();button.ondragover=e=>{e.preventDefault();button.classList.add('dragging')};button.ondragleave=()=>button.classList.remove('dragging');button.ondrop=e=>{e.preventDefault();button.classList.remove('dragging');setFile(i,[...e.dataTransfer.files].find(f=>f.type.startsWith('image/')))};input.onchange=()=>{setFile(i,input.files[0]);input.value=''};slot.append(button,input);if(item){const x=document.createElement('button');x.className='remove';x.textContent='×';x.onclick=()=>remove(i);slot.append(x);if(isLowResolution(item)){const warning=document.createElement('span');warning.className='resolution-warning';warning.textContent='低解像度';slot.append(warning)}}sheet.append(slot)});
        const filled=state.slots.filter(Boolean).length,low=state.slots.filter(isLowResolution).length;save.disabled=!filled;clear.disabled=!filled;status.innerHTML=`${state.paper}・300dpi相当／${filled}枚配置済み${low?`<div class="quality-note">低解像度の画像が${low}枚あります</div>`:''}`;tip.innerHTML=`<b>仕上がり：</b>${state.paper}${state.orientation==='portrait'?'縦':'横'}を${state.count}分割した${sizeLabel()}相当。画像は比率を保ったまま枠いっぱいに配置されます。`;
      }
      document.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{state.paper=b.dataset.paper;if(state.paper==='A4'&&state.count===32){clean();state.count=16;state.slots=Array(16).fill(null)}document.querySelectorAll('[data-paper]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('active',Number(x.dataset.count)===state.count));refreshDivisionLabels();render()});
      document.querySelectorAll('[data-orientation]').forEach(b=>b.onclick=()=>{state.orientation=b.dataset.orientation;document.querySelectorAll('[data-orientation]').forEach(x=>x.classList.toggle('active',x===b));render()});
      document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{clean();state.count=Number(b.dataset.count);state.slots=Array(state.count).fill(null);document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('active',x===b));render()});
      document.querySelectorAll('[data-lines]').forEach(b=>b.onclick=()=>{state.lines=b.dataset.lines==='on';document.querySelectorAll('[data-lines]').forEach(x=>x.classList.toggle('active',x===b));render()});
      document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{state.format=b.dataset.format;document.querySelectorAll('[data-format]').forEach(x=>x.classList.toggle('active',x===b))});
      bulk.onchange=()=>{const files=[...bulk.files].filter(f=>f.type.startsWith('image/'));let pointer=0;files.forEach(file=>{while(pointer<state.slots.length&&state.slots[pointer])pointer++;if(pointer>=state.slots.length)return;const target=pointer++;makeItem(file,item=>{if(item){state.slots[target]=item;render()}})});bulk.value=''};clear.onclick=()=>{clean();render()};
      function img(url){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url})}
      save.onclick=async()=>{const base=outputPixels(),w=state.orientation==='portrait'?base.w:base.h,h=state.orientation==='portrait'?base.h:base.w,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),g=grid(),cw=w/g.cols,ch=h/g.rows;x.fillStyle='#fff';x.fillRect(0,0,w,h);await Promise.all(state.slots.map(async(s,i)=>{if(!s)return;const im=await img(s.url),scale=Math.max(cw/im.naturalWidth,ch/im.naturalHeight),dw=im.naturalWidth*scale,dh=im.naturalHeight*scale,col=i%g.cols,row=Math.floor(i/g.cols),px=col*cw,py=row*ch;x.save();x.beginPath();x.rect(px,py,cw,ch);x.clip();x.drawImage(im,px+(cw-dw)/2,py+(ch-dh)/2,dw,dh);x.restore()}));if(state.lines){x.strokeStyle='#7b8491';x.lineWidth=3;for(let i=1;i<g.cols;i++){const p=Math.round(i*cw)+.5;x.beginPath();x.moveTo(p,0);x.lineTo(p,h);x.stroke()}for(let i=1;i<g.rows;i++){const p=Math.round(i*ch)+.5;x.beginPath();x.moveTo(0,p);x.lineTo(w,p);x.stroke()}}const mime=state.format==='png'?'image/png':'image/jpeg',ext=state.format==='png'?'png':'jpg';c.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${state.paper}_${state.orientation==='portrait'?'縦':'横'}_${state.count}分割_${sizeLabel()}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},mime,.98)};
      refreshDivisionLabels();render();
    })();
  </script>
</body>
</html>
